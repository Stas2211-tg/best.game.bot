<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>НИКСАР · Врата эфира</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="mist"></div>
    <div class="dark-veil"></div>

    <div class="nyxara-container">
        <header class="rune-header">
            <div class="sigil">◈ НИКСАР ◈</div>
            <div class="ether-balance">
                <span class="ether-label">эфир</span>
                <span class="ether-value" id="balance">0</span>
            </div>
        </header>

        <nav class="mystic-tabs">
            <button class="tab-btn active" data-tab="games">🎲 игры</button>
            <button class="tab-btn" data-tab="pets">🐉 спутники</button>
            <button class="tab-btn" data-tab="alliances">🏛️ альянсы</button>
            <button class="tab-btn" data-tab="profile">👤 храм</button>
        </nav>

        <div id="games" class="tab-pane active">
            <div class="games-grid">
                <div class="game-rune" data-game="dice1">🎲 грань судьбы</div>
                <div class="game-rune" data-game="dice2">🎲🎲 двойной рок</div>
                <div class="game-rune" data-game="rps">⚔️ дуэль</div>
                <div class="game-rune" data-game="slots">🎰 зов волн</div>
                <div class="game-rune" data-game="guess">🔮 оракул</div>
            </div>
            <div id="oracle" class="oracle-whisper"></div>
        </div>

        <div id="pets" class="tab-pane">
            <div class="pets-section">
                <h3>✦ твои спутники ✦</h3>
                <div id="myPets"></div>
                <h3>✦ лавка душ ✦</h3>
                <div id="shopPets"></div>
            </div>
        </div>

        <div id="alliances" class="tab-pane">
            <div id="alliancePanel"></div>
            <div class="alliance-top">
                <h3>🏆 топ альянсов</h3>
                <div id="topAlliances"></div>
            </div>
        </div>

        <div id="profile" class="tab-pane">
            <div class="profile-shrine">
                <div class="avatar-rune">◈ <span id="username">странник</span> ◈</div>
                <div class="stats-runes">
                    <div>🎮 <span id="gamesCount">0</span> игр</div>
                    <div>🏆 <span id="winsCount">0</span> побед</div>
                </div>
                <button id="bonusBtn" class="ritual-button">✦ получить дар ✦</button>
            </div>
        </div>
    </div>

    <div id="gameModal" class="modal-veil">
        <div class="modal-rune">
            <div class="modal-header">
                <span id="modalTitle">игра</span>
                <span class="modal-close">✕</span>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
