<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NYXARA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo">⚡ NYXARA</div>
            <div class="balance">💰 <span id="balance">0</span></div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="games">🎮 ИГРЫ</button>
            <button class="tab" data-tab="profile">👤 ПРОФИЛЬ</button>
        </div>

        <div id="games" class="tab-content active">
            <div class="game-list">
                <div class="game-card" onclick="gameDice1()">
                    <div class="game-icon">🎲</div>
                    <div class="game-name">1 кубик</div>
                    <div class="game-cost">1💰</div>
                </div>
                <div class="game-card" onclick="gameDice2()">
                    <div class="game-icon">🎲🎲</div>
                    <div class="game-name">2 кубика</div>
                    <div class="game-cost">1💰</div>
                </div>
                <div class="game-card" onclick="gameRPS()">
                    <div class="game-icon">✂️</div>
                    <div class="game-name">КНБ</div>
                    <div class="game-cost">1💰</div>
                </div>
                <div class="game-card" onclick="gameSlots()">
                    <div class="game-icon">🎰</div>
                    <div class="game-name">Слоты</div>
                    <div class="game-cost">1💰</div>
                </div>
                <div class="game-card" onclick="gameGuess()">
                    <div class="game-icon">🔢</div>
                    <div class="game-name">Угадай число</div>
                    <div class="game-cost">1💰</div>
                </div>
            </div>
            <div id="result" class="result"></div>
        </div>

        <div id="profile" class="tab-content">
            <div class="profile-card">
                <div class="avatar">👤</div>
                <div class="username" id="username">Игрок</div>
                <div class="stats">
                    <div>🎮 <span id="gamesCount">0</span></div>
                    <div>🏆 <span id="winsCount">0</span></div>
                </div>
                <button class="bonus-btn" onclick="getBonus()">🎁 БОНУС</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">ИГРА</span>
                <span class="close" onclick="closeModal()">✕</span>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
